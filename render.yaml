# Render.com blueprint — one free web service that serves BOTH the API and the
# built React app (single origin, no CORS needed). The frontend is pre-built and
# committed to frontend/dist, so this Python-only build needs no Node.
#
# Deploy: push to GitHub → Render → New → Blueprint → pick the repo → Apply.
# No manual env vars needed (host/CSRF default to *.onrender.com). Web Push (VAPID)
# is optional and can be added later in the dashboard.
services:
  - type: web
    name: ananda-taskboard
    runtime: python
    plan: free
    rootDir: .
    # NOTE: backend/Procfile's `release: migrate` phase is legacy/local-only —
    # this blueprint's buildCommand/startCommand governs on Render, not the
    # Procfile. migrate is intentionally run here at build time instead.
    buildCommand: >
      pip install -r backend/requirements.txt &&
      python backend/manage.py collectstatic --noinput &&
      python backend/manage.py migrate --noinput
    # 2 workers x 4 threads: serves the burst of parallel /api calls each view
    # fires without queueing behind a single worker. Threads are cheap here
    # because requests are I/O-bound (waiting on Neon). If the free tier's 512MB
    # ever OOMs, dial to "--workers 1 --threads 8".
    startCommand: gunicorn config.wsgi --chdir backend --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DAILY_PUSH_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Los_Angeles
      # DATABASE_URL: set this in the Render dashboard to a Neon (free, persistent)
      # Postgres connection string for data that survives redeploys forever.
      # If unset, the app uses SQLite (ephemeral on Render free → resets on deploy).
      - key: DATABASE_URL
        sync: false
