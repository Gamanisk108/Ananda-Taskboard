# Render.com blueprint — one free web service that serves BOTH the API and the
# built React app (single origin, no CORS needed). The frontend is pre-built and
# committed to frontend/dist, so this Python-only build needs no Node.
#
# Deploy: push to GitHub → Render → New → Blueprint → pick the repo → Apply.
# No manual env vars needed (host/CSRF default to *.onrender.com). Web Push (VAPID)
# is optional and can be added later in the dashboard.
services:
  - type: web
    name: ananda-taskboard
    runtime: python
    plan: free
    rootDir: .
    buildCommand: >
      pip install -r backend/requirements.txt &&
      python backend/manage.py collectstatic --noinput &&
      python backend/manage.py migrate --noinput &&
      python backend/manage.py seed_demo
    startCommand: gunicorn config.wsgi --chdir backend --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DAILY_PUSH_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Los_Angeles
      # Persistent Postgres (free). Auto-injected from the database below, so data
      # survives redeploys. Remove this to fall back to (ephemeral) SQLite.
      - key: DATABASE_URL
        fromDatabase:
          name: ananda-db
          property: connectionString

databases:
  - name: ananda-db
    plan: free
    databaseName: ananda
    user: ananda
