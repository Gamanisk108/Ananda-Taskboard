<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rulings — web board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Red+Hat+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="ananda-translations.css" rel="stylesheet" />
<style>
/* This page renders ONE variant of the real List view (tr-base chrome,
   verbatim) inside an artboard iframe. Additions below are the pending-
   approval treatment only — never restyles of existing classes. */
html,body{margin:0;height:100%;overflow:hidden;background:#fbf6ea}

/* Q2-A · in place: warm-gold row tint (same vocabulary as overdue/due-soon)
   + a non-interactive "Pending approval" pill in the Status column */
.lst tbody tr.pending{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.pill-pending{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;
  color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}

/* Q2-A · summary-strip chip */
.shell-summary .ss.pend,.shell-summary .ss.pend b{color:var(--gold-deep)}

/* Q2-B · "Waiting for approval" band at the top of the table */
.lst tr.pend-head td{background:color-mix(in srgb,var(--gold) 12%,var(--surface));color:var(--gold-deep);
  font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 11px}
.lst tr.pend-head .ph-hint{font-weight:500;text-transform:none;letter-spacing:0;opacity:.85;margin-left:10px;font-size:11.5px}

/* Q2-C · account-menu row count badge */
.um-item .um-badge{font-family:var(--f-mono);font-size:10.5px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--gold-deep);border-radius:var(--r-pill);padding:1px 7px}

/* Q2-A · small "Edit pending" pill after the task name */
.pill-pending.sm{font-size:10.5px;padding:1px 7px;flex:none}

/* Q2-C destination · "Waiting for approval" dialog */
.rq-chip{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rq-chip.new{color:var(--dome);background:color-mix(in srgb,var(--dome) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--dome) 26%,transparent)}
.rq-chip.edit{color:var(--gold-deep);background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 36%,transparent)}
.lst tr.rq-diffrow td{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--sunk);padding:5px 11px}
.lst tr.rq-diffrow .arr{color:var(--gold-deep)}
.rq-note{margin-top:12px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body class="atheme">
<script src="tr-base.js"></script>
<script src="web-ruling.js"></script>
</body>
</html>
