name: Fallow Code Health

on:
     push:
       branches: [main]
     pull_request:

permissions:
     contents: read
     pull-requests: write

jobs:
     fallow:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
           with:
             fetch-depth: 0
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - name: Fallow
           uses: fallow-rs/fallow@v2
           with:
             score: true
             comment: true
             fail-on-issues: false
