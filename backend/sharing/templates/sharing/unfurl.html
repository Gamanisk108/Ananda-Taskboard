<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · Ananda Taskboard</title>
  <meta name="description" content="{{ description }}" />

  <!-- Open Graph (Slack, WhatsApp, iMessage, Discord, Telegram, LinkedIn…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ananda Taskboard" />
  <meta property="og:title" content="{{ title }}" />
  <meta property="og:description" content="{{ description }}" />
  <meta property="og:url" content="{{ page_url }}" />
  <meta property="og:image" content="{{ image_url }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ spec.kind }}: {{ title }}" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ title }}" />
  <meta name="twitter:description" content="{{ description }}" />
  <meta name="twitter:image" content="{{ image_url }}" />

  <style>
    :root { --bg:#f6efde; --surface:#fffdf8; --border:#e4d8bb; --ink:#23262b;
            --muted:#5a6172; --navy:#1e3a6e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center;
           justify-content:center; background:var(--bg); color:var(--ink);
           font-family:"Instrument Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           padding:24px; }
    .wrap { width:100%; max-width:680px; text-align:center; }
    .card-img { width:100%; height:auto; border-radius:18px;
                box-shadow:0 8px 30px rgba(0,0,0,.12); border:1px solid var(--border);
                display:block; }
    .cta { margin-top:24px; }
    .btn { display:inline-block; background:var(--navy); color:#fff; text-decoration:none;
           font-weight:600; font-size:16px; padding:13px 26px; border-radius:12px; }
    .btn:hover { filter:brightness(1.08); }
    .note { margin-top:12px; color:var(--muted); font-size:13.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="card-img" src="{{ image_url }}" alt="{{ spec.kind }}: {{ title }}" />
    <div class="cta">
      <a class="btn" href="{{ deep_link }}">Open in Ananda Taskboard</a>
      <p class="note">You'll need to sign in to view the full {{ spec.kind|lower }}.</p>
    </div>
  </div>
</body>
</html>
